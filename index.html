<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>NFT preview card component</title>
  </head>
  <body>
    <main class="nft-card">
      <img
        class="nft-image"
        src="images/image-equilibrium.jpg"
        alt="One from the equilibrium collection"
      />
      <h1 class="heading-primary">Equilibrium #3429</h1>
      <p>Our Equilibrium collection promotes balance and calm.</p>
      <div class="card-info">
        <span class="card-price">0.041 ETH</span>
        <span class="card-limited-time">3 days left</span>
      </div>

      <div class="nft-creator">
        <img
          class="jules-image"
          src="images/image-avatar.png"
          alt="A profile picture of Jules Wyvern"
        />
        <div class="creator-text">
          <span class="creation-text">Creation of</span>
          <span class="creator-name">Jules Wyvern</span>
        </div>
      </div>
    </main>
  </body>
</html>
